version: '3'

vars:
  APP_NAME: "tuxshell"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'
  # App packages only; build/ holds generated platform helpers we don't vet or test.
  GO_PKGS:
    sh: go list -e ./... | grep -v /build/ | tr '\n' ' '
  # Developer tools (task tools installs them into $(go env GOPATH)/bin).
  GOLANGCI_LINT_VERSION: v2.14.0
  GITLEAKS_VERSION: v8.30.1

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  flatpak:
    summary: Builds bin/TuxShell-<version>-x86_64.flatpak from this checkout (needs flatpak-builder; see build/flatpak)
    vars:
      VERSION:
        sh: node -p "require('./frontend/package.json').version"
      # Outside the checkout, which the manifest copies as its source.
      WORK:
        sh: echo "${XDG_CACHE_HOME:-$HOME/.cache}/tuxshell-flatpak"
    cmds:
      # The GNOME runtime and SDK come from Flathub; the bundle points there, so
      # installing it fetches the runtime too. rofiles-fuse is off: it needs FUSE.
      - flatpak-builder --user --force-clean --disable-rofiles-fuse --install-deps-from=flathub --default-branch=stable --state-dir="{{.WORK}}/state" --repo="{{.WORK}}/repo" "{{.WORK}}/build" build/flatpak/io.github.vgrigolaia.TuxShell.yml
      - mkdir -p bin
      - flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo "{{.WORK}}/repo" bin/TuxShell-{{.VERSION}}-x86_64.flatpak io.github.vgrigolaia.TuxShell stable

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  dev:desktop:
    summary: Installs a desktop entry and icon for this user, so a dev build shows its icon in the dock
    vars:
      APPS: '{{.XDG_DATA_HOME | default (printf "%s/.local/share" .HOME)}}'
    cmds:
      - install -Dm644 build/appicon.svg "{{.APPS}}/icons/hicolor/scalable/apps/tuxshell.svg"
      - mkdir -p "{{.APPS}}/applications"
      - sed 's#^Exec=tuxshell#Exec={{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}#' build/linux/tuxshell.desktop > "{{.APPS}}/applications/io.github.vgrigolaia.TuxShell.desktop"

  lint:
    summary: Runs golangci-lint, a secret scan (gitleaks) and Svelte/TypeScript checks
    preconditions:
      - sh: command -v golangci-lint && command -v gitleaks
        msg: "golangci-lint or gitleaks is missing: run 'task tools'"
    # main.go embeds frontend/dist, so the frontend must be built before Go tooling runs.
    deps:
      - task: common:build:frontend
    cmds:
      # go vet, staticcheck, errcheck, gofmt and more (see .golangci.yml).
      - golangci-lint run ./...
      # Secrets in uncommitted and staged changes, then in the whole history.
      - gitleaks git --pre-commit --no-banner --redact .
      - gitleaks git --pre-commit --staged --no-banner --redact .
      - gitleaks git --no-banner --redact --log-level warn .
      - npm --prefix frontend run check

  tools:
    summary: Installs the pinned golangci-lint and gitleaks into $(go env GOPATH)/bin
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
      - go install github.com/zricethezav/gitleaks/v8@{{.GITLEAKS_VERSION}}

  test:
    summary: Runs Go tests
    deps:
      - task: common:build:frontend
    cmds:
      - go test {{.GO_PKGS}}

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
