# Publishes the release's .deb and .rpm to the package repository on
# pkg.tuxshell.io (Cloudflare R2), so `apt upgrade` and `dnf upgrade` find them.
# Runs when a GitHub Release is published (the .deb and .rpm must be attached
# by then). Run it by hand with a tag (Actions → Package repository → Run
# workflow) to publish or republish that release.
#
# Secrets: PKG_GPG_KEY (armored private signing key), PKG_GPG_PASSPHRASE,
# R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (an R2 token for the
# tuxshell-pkg bucket only).
name: Package repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to publish, e.g. v1.5.3"
        required: true

permissions:
  contents: read

# One update at a time: each run starts from what the previous one uploaded.
concurrency:
  group: pkg-repo
  cancel-in-progress: false

env:
  BUCKET: tuxshell-pkg
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }

      - name: Install the repository tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils createrepo-c rpm rclone

      - name: Download the release's packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.deb' -p '*.rpm' -D new
          ls -l new
          [[ $(ls new/*.deb | wc -l) == 1 && $(ls new/*.rpm | wc -l) == 1 ]] || { echo "expected one .deb and one .rpm"; exit 1; }

      - name: Download the current repository
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: |
          mkdir site
          rclone copy "r2:$BUCKET" site

      - name: Add the packages and sign the repository
        env:
          PKG_GPG_KEY: ${{ secrets.PKG_GPG_KEY }}
          PKG_GPG_PASSPHRASE: ${{ secrets.PKG_GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME=$RUNNER_TEMP/gnupg
          mkdir -m 700 "$GNUPGHOME"
          export GPG_PASSPHRASE_FILE=$RUNNER_TEMP/passphrase
          (umask 077; printf '%s' "$PKG_GPG_PASSPHRASE" >"$GPG_PASSPHRASE_FILE")
          printf '%s\n' "$PKG_GPG_KEY" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          export GPG_KEY_ID
          build/repo/update.sh site new
          rm -f "$GPG_PASSPHRASE_FILE"

      # Packages first, then the metadata that points at them, so a client never
      # sees an index naming a file that isn't there yet. The metadata keeps its
      # name between releases, so Cloudflare's cache must check it every time.
      - name: Upload
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: |
          rclone copy site "r2:$BUCKET" --include '*.deb' --include '*.rpm' \
            --header-upload 'Cache-Control: public, max-age=31536000, immutable'
          rclone sync site "r2:$BUCKET" --header-upload 'Cache-Control: no-cache'
          rclone ls "r2:$BUCKET"
