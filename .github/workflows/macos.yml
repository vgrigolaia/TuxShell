# Builds the macOS app (one universal .dmg for Apple silicon and Intel) and
# runs the Go tests on macOS. The .dmg is ad-hoc signed, not notarized.
# release/* branches build it too, so a release's .dmg is checked before its tag.
# On a v* tag the .dmg is also added to that tag's GitHub Release (a draft is
# created when there is none yet; the Linux packages and notes are added by hand).
# Run it by hand with a tag (Actions → macOS → Run workflow) to build the
# chosen branch and add its .dmg to that tag's release.
name: macOS

on:
  push:
    tags: ["v*"]
    branches: [feature/macos, "release/*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Add the .dmg to this release, e.g. v1.4.1 (empty: build only)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # The icon macOS 26 shows (Assets.car, from build/appicon.icon) can only be
  # compiled on macOS 26 (actool 26). Older macOS uses icons.icns, so when this
  # job fails the .dmg is still built, with a warning.
  icon:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Compile Assets.car
        run: |
          sw_vers
          xcrun actool --version
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28
          mkdir out
          "$(go env GOPATH)/bin/wails3" generate icons -iconcomposerinput build/appicon.icon -macassetdir out
          ls -l out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-car
          path: out/Assets.car
          if-no-files-found: error

  build:
    needs: icon
    # Also when the icon job failed (see above).
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest 1.26 patch: go.mod's "go 1.26.0" is only the minimum, and
          # the tools below need newer patches (Task v3.54.0 needs 1.26.4).
          go-version: "1.26.x"
          check-latest: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Task and the Wails CLI
        run: |
          go version
          for tool in github.com/go-task/task/v3/cmd/task@v3.54.0 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28; do
            # Errors as annotations, so they show on the run's summary page.
            go install "$tool" 2> install.log || {
              while IFS= read -r line; do echo "::error title=install::${line}"; done < install.log
              exit 1
            }
          done
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend packages
        run: npm ci --prefix frontend

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: assets-car
          path: build/darwin

      - name: Check the macOS 26 icon
        run: |
          if [ -f build/darwin/Assets.car ]; then ls -l build/darwin/Assets.car
          else echo "::warning title=icon::No Assets.car (the icon job failed): macOS 26 shows icons.icns in a frame."
          fi

      - name: Test
        shell: bash
        run: |
          set +e
          task test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          # Failures as annotations, so they show on the run's summary page.
          grep -E -- '--- FAIL|^FAIL|^panic:|_test\.go:[0-9]+:|cannot|undefined:' test.log | grep -v '^ok' | head -40 |
            while IFS= read -r line; do echo "::error title=test::${line}"; done
          exit "$status"

      # Also after failed tests, so one run shows every problem.
      - name: Build the universal app and .dmg
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          {
            task darwin:package:universal &&
            # Mac users see the bundle name; the program inside stays "tuxshell".
            mv bin/tuxshell.app bin/TuxShell.app &&
            task darwin:create:dmg APP_NAME=TuxShell
          } 2>&1 | tee build.log || {
            grep -iE 'error|undefined|cannot|failed' build.log | head -30 |
              while IFS= read -r line; do echo "::error title=build::${line}"; done
            exit 1
          }

      - name: Name the .dmg after the version
        if: ${{ !cancelled() }}
        run: |
          version=$(node -p "require('./frontend/package.json').version")
          mv bin/TuxShell.dmg "bin/TuxShell-${version}-universal.dmg"
          (cd bin && shasum -a 256 "TuxShell-${version}-universal.dmg" > "TuxShell-${version}-universal.dmg.sha256")
          ls -l bin

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: TuxShell-macos
          path: |
            bin/TuxShell-*-universal.dmg
            bin/TuxShell-*-universal.dmg.sha256
          if-no-files-found: error

  # A separate job, so only this one can write to the repository's releases;
  # the build (which runs npm packages) keeps a read-only token.
  release:
    # Only the build has to succeed; a failed icon job just leaves the older-style icon.
    if: ${{ !cancelled() && needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TuxShell-macos
          path: dmg

      - name: Add the .dmg to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ls -l dmg
          # The tag must be a release tag and match the app version inside the .dmg name.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ ! -f "dmg/TuxShell-${TAG#v}-universal.dmg" ]; then
            echo "::error title=release::$TAG doesn't match the built .dmg ($(ls dmg | head -1))"
            exit 1
          fi
          # Listed, not "gh release view": that misses drafts and a rerun would make a second one.
          found=$(gh release list --limit 100 --json tagName --jq ".[] | select(.tagName == \"$TAG\") | .tagName")
          if [ -z "$found" ]; then
            gh release create "$TAG" --draft --verify-tag --title "TuxShell ${TAG#v}" \
              --notes "Release notes and the Linux packages are added before publishing."
          fi
          gh release upload "$TAG" dmg/TuxShell-*-universal.dmg dmg/TuxShell-*-universal.dmg.sha256 --clobber
          echo "::notice title=release::Added the .dmg to https://github.com/${GH_REPO}/releases/tag/${TAG} (drafts are under Releases)."
