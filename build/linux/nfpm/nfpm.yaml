# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "tuxshell"
arch: ${GOARCH}
platform: "linux"
version: "1.1.8"
section: "net"
priority: "extra"
maintainer: "vgrigolaia <vgrigolaia@outlook.com>"
# The first line is the package summary.
description: |
  Manage and connect to your SSH hosts
  TuxShell is a free, open-source SSH connection manager for Linux. It
  connects with your system ssh, so your ~/.ssh/config, keys, agents and
  jump hosts work as they already do.

  - Saved hosts with groups, tags, jump hosts and operating system logos
  - Import from ~/.ssh/config, CSV, Excel, MobaXterm, Remmina, PuTTY, Ansible
  - Split view with up to four panes, and typing to several servers at once
  - A file browser that reuses your open SSH connection
  - Snippets, port forwards and SOCKS tunnels
  - Encrypted clipboard history, dark and light themes

  No account and no cloud: your hosts stay on your computer.
vendor: "vgrigolaia"
homepage: "https://github.com/vgrigolaia/TuxShell"
license: "GPL-3.0-or-later"
release: "1"

contents:
  - src: "./bin/tuxshell"
    dst: "/usr/bin/tuxshell"
  - src: "./build/appicon.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/tuxshell.svg"
  - src: "./build/linux/tuxshell.desktop"
    dst: "/usr/share/applications/io.github.vgrigolaia.TuxShell.desktop"
  - src: "./build/linux/icons/tuxshell-64.png"
    dst: "/usr/share/icons/hicolor/64x64/apps/tuxshell.png"
  - src: "./build/linux/icons/tuxshell-128.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/tuxshell.png"
  - src: "./build/linux/icons/tuxshell-256.png"
    dst: "/usr/share/icons/hicolor/256x256/apps/tuxshell.png"
  - src: "./build/linux/icons/tuxshell-512.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/tuxshell.png"
  # AppStream: name, icon, description and releases in GNOME Software / KDE Discover.
  - src: "./build/linux/io.github.vgrigolaia.TuxShell.metainfo.xml"
    dst: "/usr/share/metainfo/io.github.vgrigolaia.TuxShell.metainfo.xml"
  - src: "./LICENSE"
    dst: "/usr/share/licenses/tuxshell/LICENSE"
  # Debian keeps a package's license here (machine-readable copyright format).
  - src: "./build/linux/copyright"
    dst: "/usr/share/doc/tuxshell/copyright"
    packager: deb

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
# TuxShell runs the system ssh, and lists fonts with fontconfig.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  - openssh-client
  - fontconfig

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
      - openssh-clients
      - fontconfig

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
