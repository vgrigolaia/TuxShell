# golangci-lint v2 (pinned in Taskfile.yml: GOLANGCI_LINT_VERSION).
version: "2"

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose # HTTP response bodies are closed
    - misspell
    - unconvert # needless type conversions
  settings:
    staticcheck:
      # The defaults, plus keeping explicit embedded fields (s.Terminal.Profile).
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1008"]
    errcheck:
      # Cleanup on paths that already return an error, or after the work is
      # done. Writes check their Close where it matters.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.Stmt).Close
        - (net.Listener).Close
        - (*net.UnixListener).Close
        - (net.Conn).Close
        - (*net.conn).Close
        - os.Remove
        - os.RemoveAll
  exclusions:
    paths:
      # Generated by Wails for other platforms.
      - build/
    rules:
      # Test setup: a failed write shows up as a failed assertion.
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
